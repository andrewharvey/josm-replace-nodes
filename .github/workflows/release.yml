name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JOSM jar
        run: |
          sudo mkdir -p /usr/share/josm
          sudo curl -fsSL https://josm.openstreetmap.de/download/josm.jar -o /usr/share/josm/josm.jar

      - name: Build plugin jar
        run: ant dist

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/replace-nodes.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes
